<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Vision Companion</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="app" class="app" aria-live="polite">
      <header class="header">
        <p id="tapHint" class="tap-hint">● Tap anywhere to start</p>
        <h1>Vision Companion</h1>
        <p class="subtitle">Audio-first blind navigation assistant</p>
      </header>

      <section id="centerRing" class="center-ring stopped" aria-label="Assistant status">
        <div class="icon" id="centerIcon">🎙️</div>
        <p id="centerState" class="state-text">Stopped</p>
      </section>

      <section class="status-grid" aria-label="Sensors">
        <article class="status-card">
          <p class="label">GPS</p>
          <p id="gpsState">Off</p>
        </article>
        <article class="status-card">
          <p class="label">Vision</p>
          <p id="visionState">Off</p>
        </article>
      </section>

      <section class="panel">
        <p id="statusText">Tap anywhere to start navigation</p>
        <p id="permissionText">Permissions: microphone, camera, location not granted</p>
      </section>

      <section class="panel panel-small">
        <p class="foot">Voice: “start navigation”, “stop”, “what is ahead”, “describe surroundings”</p>
      </section>

      <video id="cameraPreview" class="sr-only" autoplay playsinline muted></video>
      <canvas id="frameCanvas" class="sr-only"></canvas>
      <div id="liveRegion" class="sr-only" aria-live="assertive" aria-atomic="true"></div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
